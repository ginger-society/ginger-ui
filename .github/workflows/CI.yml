name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install ginger-apps
        run: bash -c "$(curl -fsSL
          https://raw.githubusercontent.com/ginger-society/infra-as-code-repo/main/rust-helpers/install-pipeline-clis.sh)"

      - name: Authenticate with ginger-auth
        id: ginger-auth
        run: ginger-auth token-login ${{ secrets.GINGER_TOKEN }}

      - name: Update pipeline to running
        run: ginger-connector update-pipeline stage running

      - name: Publish stories
        run: |
          docker buildx build . \
            -t ginger-ui-storybook-builder \
            -f Dockerfile.book \
            --build-arg GINGER_TOKEN=${{ secrets.GINGER_TOKEN }} \
            --build-arg AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --build-arg AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --build-arg AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }} \
            --build-arg DISTRIBUTION_ID=${{ secrets.DISTRIBUTION_ID }}
        continue-on-error: false

      - name: Fail if Publish stories failed
        if: failure()
        run: ginger-connector update-pipeline stage failed
        continue-on-error: false

      - name: Build library in Docker
        run: |
          docker build . \
            -t ginger-ui-builder \
            -f Dockerfile.publish
        continue-on-error: false

      - name: Fail if build failed
        if: failure()
        run: ginger-connector update-pipeline stage failed
        continue-on-error: false

      - name: Copy built artifacts from Docker
        run: |
          # Create a container from the image
          docker create --name ginger-ui-temp ginger-ui-builder

          # Copy the dist folder and package.json from container
          docker cp ginger-ui-temp:/app/dist ./dist
          docker cp ginger-ui-temp:/app/package.json ./package.json

          # Clean up the temporary container
          docker rm ginger-ui-temp
        continue-on-error: false

      - name: Fail if copy failed
        if: failure()
        run: ginger-connector update-pipeline stage failed
        continue-on-error: false

      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 8.7.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: 20.5
          cache: 'pnpm'

      - name: Creating .npmrc
        run: |
          cat << EOF > "$HOME/.npmrc"
            email=admin@gingersociety.org
            //registry.npmjs.org/:_authToken=$NPM_TOKEN
          EOF
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: pnpm publish --no-git-checks --ignore-scripts
        continue-on-error: false

      - name: Fail if npm publish failed
        if: failure()
        run: ginger-connector update-pipeline stage failed
        continue-on-error: false

      - name: Update pipeline to passing
        if: success()
        run: ginger-connector update-pipeline stage passing

      - name: Trigger dependent pipelines
        if: success()
        run: ginger-connector trigger-dependent-pipelines ${{ secrets.GH_TOKEN }}

      - name: Trigger Homepage pipeline
        if: success()
        run: ginger-connector trigger-pipeline homepage ${{ secrets.GH_TOKEN }}

      - name: Stop execution if any step failed
        if: failure()
        run: exit 1
